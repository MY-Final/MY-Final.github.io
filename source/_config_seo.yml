# ========== SEO 优化配置文件 ==========
# 本文件包含 SEO 相关配置，已添加注释说明
# 请将内容复制到对应配置文件中

---


# 在 _config.yml 中添加或修改以下内容：

# 网站基础设置 (SEO 关键配置)
title: Final                    # 网站标题（浏览器标签页显示）
subtitle: ''                    # 副标题
description: '个人技术博客与生活笔记 - 记录学习成长点滴'  # 网站描述（80-160字符，SEO重要）
keywords: 个人博客,技术笔记,编程学习,生活记录  # 关键词
author: Final                   # 作者名
language: zh-CN                 # 网站语言

# URL 优化 (SEO)
url: https://myfinal.xyz        # 网站域名
permalink: :year/:month/:day/:title/  # 文章链接格式，SEO友好
pretty_urls:
  trailing_index: false         # 移除 /index.html
  trailing_html: false          # 移除 .html

# 元数据生成器 (SEO)
meta_generator: false           # 关闭Hexo标签，减少冗余

# Sitemap 插件
sitemap:
  path: sitemap.xml             # 生成 sitemap.xml

baidu_sitemap:
  path: baidu-sitemap.xml       # 生成 baidu-sitemap.xml


---